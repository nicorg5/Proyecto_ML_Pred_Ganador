services:
  postgres:
    image: postgres:16-alpine
    container_name: laliga_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laliga_predictor
      POSTGRES_USER: laliga_user
      POSTGRES_PASSWORD: laliga_password_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laliga_user -d laliga_predictor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laliga_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: laliga_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - laliga_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laliga_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://laliga_user:laliga_password_dev@postgres:5432/laliga_predictor
      SD_DATABASE_URL: postgresql://laliga_user:laliga_password_dev@postgres:5432/laliga_soccerdata
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - laliga_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  laliga_network:
    driver: bridge